# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Deterministic factoring in time N^{o(1)}"
  description: >-
    A Lean 4 proof, against Mathlib, that one deterministic Turing machine computes the smallest
    prime factor Nat.minFac N of every natural number N in time N^{o(1)}: for every k >= 1 there is a
    constant C_k such that the same machine halts with the correct output within C_k * 2^(n/k) steps
    on every n-bit input. The machine model is Mathlib's multi-stack Turing machine
    (Turing.FinTM2 with Turing.TM2ComputableInTime), with numbers in binary (Computability.encodeNat)
    and every stack alphabet finite. The best previously published deterministic bounds known to the
    authors have exponent 1/5 (Harvey 2021; Harvey and Hittmeir 2022). The proof reduces finding the
    smallest prime factor to counting divisors with prescribed leading bits, expresses that count as
    the value of a network of local checks carrying out Schoenhage-Strassen multiplication, and
    evaluates it with a re-proved form of the counting engine of the 2026 3-SAT preprint by Claude
    (Anthropic). The Challenge also states, as a proposition only and without proof, a conjecture
    that factoring can be done in time exp(O(log N / sqrt(log log N))). The ideas and the Lean code
    were generated by AI; the authors audited the statement, not the proof.
  authors:
    - "Isaac Rudich"
    - "Louis-Martin Rousseau"
  responsible_maintainers:
    - "Isaac Rudich"
  license: "Apache-2.0"

sources:
  - title: "One deterministic Turing machine computes Nat.minFac in time N^{o(1)} (this formalization)"
    authors: ["Isaac Rudich", "Louis-Martin Rousseau"]
    type: "original-proof"
    location: "Challenge.lean, Factoring.subexponentialRate"
    relationship: "other"
    note: >-
      The result is first presented by this formalization. The proof was generated by AI (Claude, Anthropic) and is checked by Lean; the authors
      audited the statement only. Novelty: the authors know of no earlier deterministic bound of the
      form N^{o(1)}, conditional or not; this is not the result of a systematic literature search.
  - title: "A 2^{o(n)} Time Algorithm for 3-SAT"
    authors: ["Claude (Anthropic)"]
    id: "Preprint, unrefereed, dated 26 October 2026; Lean development in the GitHub repository anthropics/formal-math, folder eth"
    type: "paper"
    location: "Sections 3-5 (networks, Definitions 1-2, Lemmas 1-2, Proposition 3)"
    relationship: "other"
    note: >-
      Method source. The counting engine of Sections 3-5 is re-proved here, in a variant that writes
      every table out and computes modulo small numbers, and applied to a different problem
      (factoring); the preprint's results are about counting k-CNF solutions and are not formalized
      here. No statement, definition or code is imported from it.
    author_endorsement: "not-contacted"
  - title: "The Exponential Time Hypothesis Is False"
    authors: ["OpenAI"]
    id: "Preprint, unrefereed, dated 17 October 2026, revised 25 October 2026"
    type: "paper"
    relationship: "other"
    note: >-
      The question that led to this result was to apply this preprint's result to factoring. It is an
      independent route to the same kind of counting; nothing of it enters the proof.
    author_endorsement: "not-contacted"
  - title: "Schnelle Multiplikation grosser Zahlen"
    authors: ["Arnold Schoenhage", "Volker Strassen"]
    id: "doi:10.1007/BF02242355 (Computing 7 (1971), 281-292)"
    type: "paper"
    relationship: "other"
    note: "The multiplication method whose network of local checks is counted; re-derived and proved here."
  - title: "An exponent one-fifth algorithm for deterministic integer factorisation"
    authors: ["David Harvey"]
    id: "doi:10.1090/mcom/3658 (Math. Comp. 90 (2021), 2937-2950)"
    type: "paper"
    relationship: "background"
    note: "Deterministic factoring in time O(N^{1/5} log^{16/5} N); the bound the result is compared with."
  - title: "A log-log speedup for exponent one-fifth deterministic integer factorisation"
    authors: ["David Harvey", "Markus Hittmeir"]
    id: "doi:10.1090/mcom/3708 (Math. Comp. 91 (2022), 1367-1379)"
    type: "paper"
    relationship: "background"
    note: "The best deterministic factoring bound known to the authors before this result."

related_formalizations:
  - id: "https://github.com/anthropics/formal-math (folder eth)"
    relationship: "other"
    note: >-
      Lean development of the 3-SAT preprint by Claude (Anthropic). Its counting engine is
      re-implemented and re-proved here; no code is imported from it.

classification:
  arxiv: ["math.NT", "cs.CC", "cs.DS", "cs.LO"]
  msc2020: ["11Y05", "11Y16", "68Q25", "68Q04", "68V20"]

status:
  scope: >-
    The main theorem Factoring.subexponentialRate is fully proved. The conjecture
    Factoring.SqrtLogLogConjecture is stated as a Prop and not proved. The full factorization by
    repeated calls to Nat.minFac is not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Factoring.subexponentialRate"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Several Claude agents, each given a written task (a lemma or part of the construction), working
        in a Lean project against Mathlib; every result checked by Lean, with axioms printed.
      prompting_notes: >-
        The authors asked for the ETH preprint's result to be applied to factoring, and then for a
        conjecture of how far the exponent could easily be pushed down. The reduction, the choice of
        method, the proof strategy and all of the Lean code were produced by the AI agents. The authors
        designed the statement.
  notes: >-
    AI-generated. Some files (FactoringAux/Copied) are adapted from the authors' related, also
    AI-generated, Lean work.

fidelity:
  divergences: >-
    Factoring means Nat.minFac (the smallest prime factor; Nat.minFac 1 = 1, Nat.minFac 0 = 2). Time is
    the number of steps of a Mathlib TM2 machine (a multi-stack Turing machine with finite control) as
    a function of the length of the binary input; the statement additionally requires every stack
    alphabet to be finite, which Mathlib requires only of the input stack. The constants C_k are not
    computed. The conjecture is stated, not proved.

review:
  status: "statement audited by the authors; proof not read by a human, machine-checked by Lean"
  notes: >-
    The authors audited Challenge.lean (the definitions, the theorem statement and the conjecture).
    They did not read the proof. The proof is checked by Lean; #print axioms shows only propext,
    Classical.choice and Quot.sound.

alignment:
  namespace: "Factoring"
  statements:
    - source: "Main result: one deterministic Turing machine computes the smallest prime factor in time N^{o(1)}"
      lean: "Factoring.subexponentialRate"
      module: "Challenge.lean (statement), Solution.lean (proof)"
      status: "proved"
    - source: "Conjecture: factoring in time exp(O(log N / sqrt(log log N)))"
      lean: "Factoring.SqrtLogLogConjecture"
      module: "Challenge.lean"
      status: "stated, not proved"
      note: "Stated as a Prop; not proved."

acknowledgements: >-
  Mathlib, whose TM2 machines are due to Mario Carneiro and whose FinTM2 and time notion are due to
  Pim Spelier and Daan van Gent.
